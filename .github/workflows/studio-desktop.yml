name: studio-desktop
# Builds the offline desktop app on each OS (macOS builds require a Mac runner).
# Download the installers from the run's "Artifacts" section.
on:
  workflow_dispatch:
  push:
    branches: [main, claude/sound-ninja-design-studio-f9x9em]
    paths: ["studio/**", ".github/workflows/studio-desktop.yml"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
          - os: macos-latest
            flag: --mac
          - os: ubuntu-latest
            flag: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      - name: Use HTTPS for GitHub-hosted dependencies (runners have no SSH key)
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sn/web build
      - name: Build desktop app
        run: node build.mjs ${{ matrix.flag }}
        working-directory: studio/apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Sound-Ninja-Design-Studio-${{ runner.os }}
          path: |
            studio/release/desktop/*.exe
            studio/release/desktop/*.dmg
            studio/release/desktop/*.AppImage
          if-no-files-found: error
          retention-days: 30
