# Local development database. Production: managed PostgreSQL 16 with backups (see docs/02-architecture.md).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sn
      POSTGRES_PASSWORD: sn
      POSTGRES_DB: sound_ninja
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sn-db:/var/lib/postgresql/data
volumes:
  sn-db:
